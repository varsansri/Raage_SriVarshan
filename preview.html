<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Raage_SriVarshan</title>
<meta name="description" content="An unpausable countdown to 13 July 2027 and an append-only ledger of every minute actually worked.">
<meta name="theme-color" content="#08080a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Authored icon set. One family, 1.5 stroke, 16px grid. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-alert" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
    <path d="M8 2.6 1.8 13.4h12.4L8 2.6Z" stroke-linejoin="round"/><path d="M8 6.6v3.1"/><path d="M8 11.7h.01"/>
  </symbol>
  <symbol id="i-shield" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 1.8 2.9 3.9v4c0 3 2.1 5.1 5.1 6.3 3-1.2 5.1-3.3 5.1-6.3v-4L8 1.8Z"/><path d="M5.9 7.9 7.4 9.4l3-3"/>
  </symbol>
  <symbol id="i-plus" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
    <path d="M8 3.6v8.8M3.6 8h8.8"/>
  </symbol>
  <symbol id="i-minus" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
    <path d="M3.6 8h8.8"/>
  </symbol>
  <symbol id="i-upload" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 10.6V2.9"/><path d="M5.2 5.7 8 2.9l2.8 2.8"/><path d="M2.6 10.4v1.9c0 .6.5 1.1 1.1 1.1h8.6c.6 0 1.1-.5 1.1-1.1v-1.9"/>
  </symbol>
  <symbol id="i-install" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4.1" y="1.6" width="7.8" height="12.8" rx="1.6"/><path d="M8 3.3h.01"/><path d="M8 6.4v4.4"/><path d="M6.3 9.1 8 10.8l1.7-1.7"/>
  </symbol>
  <symbol id="i-chev" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6.2 3.4 10.8 8l-4.6 4.6"/>
  </symbol>
  <symbol id="i-download" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 2.9v7.7"/><path d="M5.2 7.8 8 10.6l2.8-2.8"/><path d="M2.6 10.4v1.9c0 .6.5 1.1 1.1 1.1h8.6c.6 0 1.1-.5 1.1-1.1v-1.9"/>
  </symbol>
</defs></svg>

<p id="skew" class="banner" hidden></p>

<main>

  <header class="head">
    <h1>RAAGE<span class="us">_</span>SRIVARSHAN</h1>
  </header>

  <!-- ══ install: shown only when the browser confirms it is installable ══ -->
  <div id="installWrap" class="install">
    <button type="button" id="install" class="install-btn">
      <svg class="i install-mark" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-install"/></svg>
      <span class="install-txt">
        <b id="installTitle">Install as an app</b>
        <i id="installSub">Full screen, offline, no browser bar</i>
      </span>
      <svg class="i install-go" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-chev"/></svg>
    </button>
  </div>

  
  <div class="install" data-mode="ios">
    <button type="button" class="install-btn">
      <svg class="i install-mark" viewBox="0 0 16 16"><use href="#i-install"/></svg>
      <span class="install-txt"><b>Add to your home screen</b><i>Tap Share, then "Add to Home Screen"</i></span>
      <svg class="i install-go" viewBox="0 0 16 16"><use href="#i-chev"/></svg>
    </button>
  </div>
  <div class="install" data-mode="manual">
    <button type="button" class="install-btn">
      <svg class="i install-mark" viewBox="0 0 16 16"><use href="#i-install"/></svg>
      <span class="install-txt"><b>Install as an app</b><i>Use your browser menu, then "Install app"</i></span>
      <svg class="i install-go" viewBox="0 0 16 16"><use href="#i-chev"/></svg>
    </button>
  </div>
</main></body></html>
